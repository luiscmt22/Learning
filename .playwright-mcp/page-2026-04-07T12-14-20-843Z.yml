  - paragraph [ref=e351]: "Dictionary selection: Uses servicesDict for servicosIds, viaturasDict for viaturasIds"
  - paragraph [ref=e352]: "Array handling: For array columns, converts IDs to readable values using dictionary lookup"
  - paragraph [ref=e353]: "Object values: Extracts .Nome property (for services)"
  - paragraph [ref=e354]: "String values: Uses the string directly (for viaturas)"
  - paragraph [ref=e355]: "Fallback: Uses original ID if dictionary lookup fails"
  - paragraph [ref=e356]: "Array joining: Combines multiple values into single searchable string with spaces"
  - paragraph [ref=e357]: "Single value handling: Converts non-array values directly to lowercase string"
  - paragraph [ref=e358]: "Case conversion: Converts both cell and filter text to lowercase for case-insensitive comparison"
  - paragraph [ref=e359]: "Filter logic: Uses switch statement to apply different filter types:"
  - paragraph [ref=e360]: "equals: Exact match"
  - paragraph [ref=e361]: "contains: Cell value contains the filter text (works across multiple array values)"
  - paragraph [ref=e362]: "startsWith: Cell value begins with filter text"
  - paragraph [ref=e363]: "endsWith: Cell value ends with filter text"
  - paragraph [ref=e364]: "notContains/notEqual: Opposite logic"
  - paragraph [ref=e365]: "Key Enhancement: Now supports filtering by human-readable values instead of raw IDs for array columns, while maintaining backward compatibility with single-value columns."
