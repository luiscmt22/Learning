  - paragraph [ref=e341]: "// Early exit for null/undefined if (cellValue === null || cellValue === undefined) { return false; }"
  - paragraph [ref=e342]: // Get column field to determine data type const columnField = this.params.column.colDef.field;
  - paragraph [ref=e343]: "// Choose the right Dictionary for array columns let dictionary; if (columnField === 'servicosIds') { dictionary = this.params.context.servicesDict; } else if (columnField === 'viaturasIds') { dictionary = this.params.context.viaturasDict; }"
  - paragraph [ref=e344]: "// Convert to searchable string (handles both arrays and single values) let cellValueStr; if (Array.isArray(cellValue)) { // Handle array columns (servicosIds, viaturasIds) const readableValues = cellValue.map(id => { const dictValue = dictionary[id]; return dictValue?.Nome || dictValue || id; // Handle both object and string values }); cellValueStr = readableValues.join(' ').toLowerCase(); } else { // Handle single value columns (motoristaId, data, etc.) cellValueStr = cellValue.toString().toLowerCase(); }"
  - paragraph [ref=e345]: // Prepare filter text for comparison const filterTextLower = filterText.toLowerCase();
