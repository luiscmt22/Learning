  - heading "6. doesFilterPass(params) - The Core Filtering Logic (Updated)" [level=2] [ref=e435]
  - paragraph [ref=e436]: Javascript
  - paragraph [ref=e437]: "CustomTextFilter.prototype.doesFilterPass = function(params) { // Get cell value const cellValue = this.params.valueGetter(params); const filterText = this.filterText;"
  - paragraph [ref=e438]: "// Early exit for null/undefined if (cellValue === null || cellValue === undefined) { return false; }"
  - paragraph [ref=e439]: // Get column field to determine data type const columnField = this.params.column.colDef.field;
  - paragraph [ref=e440]: "// Choose the right Dictionary for array columns let dictionary; if (columnField === 'servicosIds') { dictionary = this.params.context.servicesDict; } else if (columnField === 'viaturasIds') { dictionary = this.params.context.viaturasDict; }"
  - paragraph [ref=e441]: "// Convert to searchable string (handles both arrays and single values) let cellValueStr; if (Array.isArray(cellValue)) { // Handle array columns (servicosIds, viaturasIds) const readableValues = cellValue.map(id => { const dictValue = dictionary[id]; return dictValue?.Nome || dictValue || id; // Handle both object and string values }); cellValueStr = readableValues.join(' ').toLowerCase(); } else { // Handle single value columns (motoristaId, data, etc.) cellValueStr = cellValue.toString().toLowerCase(); }"
  - paragraph [ref=e442]: // Prepare filter text for comparison const filterTextLower = filterText.toLowerCase();
  - paragraph [ref=e443]: "// Apply filter based on filter type switch (this.filterType) { case 'equals': return cellValueStr === filterTextLower; case 'notEqual': return cellValueStr !== filterTextLower; case 'contains': return cellValueStr.indexOf(filterTextLower) >= 0; case 'notContains': return cellValueStr.indexOf(filterTextLower) === -1; case 'startsWith': return cellValueStr.indexOf(filterTextLower) === 0; case 'endsWith': return cellValueStr.indexOf(filterTextLower, cellValueStr.length - filterTextLower.length) !== -1; default: return false; } };"
  - paragraph [ref=e444]: "What it does:"
  - paragraph [ref=e445]: "Gets cell value: Extracts the value from the current row/cell"
  - paragraph [ref=e446]: "Null check: Returns false for empty values"
  - paragraph [ref=e447]: "Column detection: Identifies which column is being filtered to choose correct dictionary"
  - paragraph [ref=e448]: "Dictionary selection: Uses servicesDict for servicosIds, viaturasDict for viaturasIds"
  - paragraph [ref=e449]: "Array handling: For array columns, converts IDs to readable values using dictionary lookup"
  - paragraph [ref=e450]: "Object values: Extracts .Nome property (for services)"
  - paragraph [ref=e451]: "String values: Uses the string directly (for viaturas)"
  - paragraph [ref=e452]: "Fallback: Uses original ID if dictionary lookup fails"
  - paragraph [ref=e453]: "Array joining: Combines multiple values into single searchable string with spaces"
  - paragraph [ref=e454]: "Single value handling: Converts non-array values directly to lowercase string"
  - paragraph [ref=e455]: "Case conversion: Converts both cell and filter text to lowercase for case-insensitive comparison"
  - paragraph [ref=e456]: "Filter logic: Uses switch statement to apply different filter types:"
  - paragraph [ref=e457]: "equals: Exact match"
  - paragraph [ref=e458]: "contains: Cell value contains the filter text (works across multiple array values)"
  - paragraph [ref=e459]: "startsWith: Cell value begins with filter text"
  - paragraph [ref=e460]: "endsWith: Cell value ends with filter text"
  - paragraph [ref=e461]: "notContains/notEqual: Opposite logic"
  - paragraph [ref=e462]: "Key Enhancement: Now supports filtering by human-readable values instead of raw IDs for array columns, while maintaining backward compatibility with single-value columns."
