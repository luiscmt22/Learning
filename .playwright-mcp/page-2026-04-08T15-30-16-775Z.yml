  - heading "4. The Cost of Unused Async" [level=2] [ref=e192]
  - paragraph [ref=e193]: "Consider these two methods. They're functionally identical — both produce a Task that's already completed when returned:"
  - code [ref=e195]: "// Version A — async keyword, no awaits async Task SyncyFoo() { Console.WriteLine(\"hi\"); } // Version B — return Task.CompletedTask directly Task SyncyFoo() { Console.WriteLine(\"hi\"); return Task.CompletedTask; }"
  - paragraph [ref=e196]:
    - text: At the call site, they behave identically — both return a completed Task, both can be
    - code [ref=e197]: await
    - text: ed, both produce no errors. But the compiled output is dramatically different.
  - heading "Version A — compiled" [level=3] [ref=e198]
  - code [ref=e200]: "// A struct is generated struct SyncyFooStateMachine : IAsyncStateMachine { public int state; public AsyncTaskMethodBuilder builder; public void MoveNext() { try { Console.WriteLine(\"hi\"); } catch (Exception ex) { state = -2; builder.SetException(ex); return; } state = -2; builder.SetResult(); } public void SetStateMachine(IAsyncStateMachine sm) { } } // Your original method becomes a stub Task SyncyFoo() { var sm = new SyncyFooStateMachine(); sm.builder = AsyncTaskMethodBuilder.Create(); sm.state = -1; sm.builder.Start(ref sm); return sm.builder.Task; }"
