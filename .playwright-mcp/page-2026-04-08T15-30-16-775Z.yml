  - code [ref=e166]: "// Your method becomes a stub that kicks off the state machine Task FetchDataAsync() { var sm = new FetchDataAsyncStateMachine(); sm.builder = AsyncTaskMethodBuilder.Create(); sm.state = -1; sm.builder.Start(ref sm); return sm.builder.Task; } // The state machine — compiler-generated, never written by you [CompilerGenerated] struct FetchDataAsyncStateMachine : IAsyncStateMachine { public int state; // where are we in the method? public AsyncTaskMethodBuilder builder; // tracks the Task to return public TaskAwaiter<string> awaiter; // the current Task we're waiting on public string data; // local variable, hoisted to a field public void MoveNext() { switch (state) { case -1: // first entry into the method Console.WriteLine(\"Starting...\"); awaiter = httpClient.GetStringAsync(url).GetAwaiter(); if (!awaiter.IsCompleted) { state = 0; builder.AwaitUnsafeOnCompleted(ref awaiter, ref this); return; // SUSPEND HERE — release the thread } goto case 0; case 0: // resumed after the await completed data = awaiter.GetResult(); Console.WriteLine($\"Got: {data}\"); builder.SetResult(); return; } } }"
