    - generic [ref=e15]: Inside async/await — State Machines and Hidden Mains
    - generic [ref=e16]: How the C# compiler rewrites top-level statements and async methods behind your back — generating a synthetic Main and a state-machine struct before the runtime ever sees your code.
    - generic [ref=e17]: Your Program.cs has no Main method and somehow runs. Your async method pauses mid-execution and somehow resumes on a different thread. Both look like the language is cheating — but neither is. The compiler is doing something so clever before the runtime ever sees your code that it fakes two fundamentally impossible things at once. This tutorial pulls back the curtain on both.
    - generic [ref=e18]:
      - generic [ref=e19]: Executive summary
      - generic [ref=e20]: This tutorial dissolves two C# "magic" features by showing the compiler transformations beneath them. Top-level statements get wrapped in a hidden Program class with a synthesized Main whose signature the compiler picks based on whether your code uses await and/or returns an int. Async methods get rewritten as state-machine structs with a MoveNext dispatcher, a state field, and hoisted fields for every local variable — so the method can literally return, release its thread, and resume later. The doc then shows the measurable cost of writing versus returning directly, and introduces the three sentinel tasks (CompletedTask / FromResult / FromException) for fulfilling a Task contract with zero async overhead.
    - generic [ref=e21]:
      - generic [ref=e22]: 💡
      - generic [ref=e23]:
        - generic [ref=e24]: Metaphor
        - text: Async/await is like a TV show written with "previously on…" flashbacks. The script looks linear to you — scene 1, scene 2, scene 3 — but behind the camera the editor shoots scene 1, stops rolling, goes home, shoots scene 2 three months later when the guest actor is finally available, then stitches them with a short recap so the viewer never notices the gap. The compiler is that editor. The field is "which scene are we filming right now?", and the hoisted locals are the props you had to keep in storage between shoots.
