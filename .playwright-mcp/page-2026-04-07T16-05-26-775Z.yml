  - heading "The Pattern Template" [level=3] [ref=e295]
  - paragraph [ref=e296]: "Every strategy implementation follows this shape:"
  - code [ref=e298]: "// 1. The interface with a key property public interface IMyStrategy { string Key { get; } Task<Result> ExecuteAsync(Input input); } // 2. Concrete implementations public class StrategyA : IMyStrategy { public string Key => \"A\"; ... } public class StrategyB : IMyStrategy { public string Key => \"B\"; ... } // 3. The router/context public class StrategyRouter { private readonly IEnumerable<IMyStrategy> _strategies; public async Task<Result> ExecuteAsync(string key, Input input) { var strategy = _strategies.FirstOrDefault(s => s.Key == key) ?? throw new ArgumentException($\"No strategy for {key}\"); return await strategy.ExecuteAsync(input); } } // 4. DI registration builder.Services.AddScoped<IMyStrategy, StrategyA>(); builder.Services.AddScoped<IMyStrategy, StrategyB>(); builder.Services.AddScoped<StrategyRouter>();"
  - heading "The Decision Flowchart" [level=3] [ref=e299]
  - generic [ref=e300]: "Do you have multiple algorithms/behaviors for the same operation? │ ├── YES: Are they selected ONE-at-a-time based on a key? │ │ │ ├── YES ──> Strategy Pattern │ │ (ConflictDetector, ExportGenerator, ReportBuilder) │ │ │ └── NO: Do ALL run in sequence? │ │ │ ├── YES ──> Chain of Responsibility │ │ (CheckInValidators, CheckOutValidators) │ │ │ └── NO ──> Consider other patterns │ └── NO ──> You probably don't need a pattern here"
  - paragraph [ref=e301]:
    - text: "The key insight: when you have"
    - strong [ref=e302]: "\"same interface, different implementation chosen at runtime\""
    - text: ", reach for the Strategy Pattern. It keeps each algorithm isolated, testable, and independently deployable — and adding new ones never touches existing code."