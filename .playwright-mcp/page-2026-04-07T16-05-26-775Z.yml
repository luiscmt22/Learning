  - heading "Strategy Pattern — Pluggable Algorithms" [level=1] [ref=e35]
  - paragraph [ref=e36]: "Tutorial #31 — Same interface, different algorithm, chosen at runtime"
  - 'heading "1. The Problem: if/else Algorithm Selection" [level=2] [ref=e37]'
  - paragraph [ref=e38]: "Imagine you need to detect scheduling conflicts. Employees have conflicts with job schedules and day schedules. Equipment has conflicts with equipment schedules. The naive approach stuffs all of this into one massive method:"
  - code [ref=e40]: "public async Task<List<Conflict>> DetectConflicts( string entityType, int entityId, DateTime date, string db) { if (entityType == \"Employee\") { // 100 lines of employee conflict logic... // Query JobSchedule table // Query EmployeeDaySchedule table // Check feature flags for Jobs and Scheduling modules // Check approved leaves // Calculate cross-midnight overlaps } else if (entityType == \"Equipment\") { // 100 lines of equipment conflict logic... // Query JobEquipmentSchedule table // Different overlap rules (no leave checks) } else if (entityType == \"Vehicle\") // future { // ...yet another 100 lines } }"
  - heading "Why This Is Bad" [level=3] [ref=e41]
  - list [ref=e42]:
    - listitem [ref=e43]:
      - strong [ref=e44]: Violates the Open/Closed Principle
      - text: — every new entity type means modifying this method, risking bugs in existing logic
    - listitem [ref=e45]:
      - strong [ref=e46]: Massive method
      - text: — 300+ lines with completely unrelated algorithms interleaved
    - listitem [ref=e47]:
      - strong [ref=e48]: Impossible to test in isolation
      - text: — you cannot test employee conflict logic without also having equipment logic in scope
    - listitem [ref=e49]:
      - strong [ref=e50]: Dependency chaos
      - text: — the method needs every dependency for every entity type, even when only one is used
  - generic [ref=e51]:
    - text: Golden Rule If you find yourself writing
    - code [ref=e52]: if (type == X) do algorithm A, else if (type == Y) do algorithm B
    - text: ", you need the Strategy Pattern. Each algorithm should be its own class."
  - heading "2. The Strategy Pattern — Classic GoF" [level=2] [ref=e53]
  - paragraph [ref=e54]: The Strategy Pattern extracts each algorithm into its own class, all implementing the same interface. A "router" (context/detector) picks the right one at runtime based on a key.
  - generic [ref=e55]: "IScheduleConflictStrategy (interface) ├── EntityType: string ├── GetScheduleConflictsAsync() ├── GetDetailedConflictsAsync() ├── WouldCreateConflictAsync() ├── HasTimeOverlapAsync() └── CalculateDailyHoursAsync() ▲ ┌────────┴─────────────┐ EmployeeScheduleConflict EquipmentScheduleConflict Strategy Strategy EntityType = \"Employee\" EntityType = \"Equipment\" Queries: Queries: - JobSchedule - JobEquipmentSchedule - EmployeeDaySchedule - LeaveRequest Checks feature flags No feature flags needed (Jobs + Scheduling)"
  - paragraph [ref=e56]:
    - text: The caller never knows which concrete strategy runs. It just says
    - emphasis [ref=e57]: "\"detect conflicts for this entity type\""
    - text: and the right algorithm executes.
  - generic [ref=e58]: Metaphor A strategy is like a USB port — the laptop (context) doesn't care what's plugged in (keyboard, mouse, printer). It just calls the same interface. Plug in a new device? Works instantly without changing the laptop.
  - heading "3. The Interface — IScheduleConflictStrategy" [level=2] [ref=e59]
  - paragraph [ref=e60]:
    - text: This is the contract that every conflict detection algorithm must implement. It lives at
    - code [ref=e61]: Services/Core/Scheduling/ConflictDetection/IScheduleConflictStrategy.cs
    - text: ":"
  - code [ref=e63]: "/// Strategy interface for entity-specific conflict detection. /// Each entity type (Employee, Equipment) has its own strategy. /// Follows OCP - add new entities by creating new strategies without modifying existing code. /// Follows DIP - detector depends on this abstraction, not concrete implementations. public interface IScheduleConflictStrategy { /// The entity type this strategy handles (e.g., \"Employee\", \"Equipment\") string EntityType { get; } /// Detects scheduling conflicts for an entity on a specific date Task<List<ScheduleConflict>> GetScheduleConflictsAsync( int entityId, DateTime date, string companyDatabase); /// Gets detailed conflict analysis including time overlaps and daily hours Task<DetailedConflictInfo> GetDetailedConflictsAsync( int entityId, DateTime scheduleDate, DateTime endDate, TimeSpan startTime, TimeSpan endTime, int? excludeScheduleId, string companyDatabase, ConflictSourceType? excludeSourceType = null); /// Checks if adding a new schedule would create a conflict Task<bool> WouldCreateConflictAsync( int entityId, DateTime date, int? excludeJobId, string companyDatabase); /// Advanced time-based overlap detection for cross-midnight shifts Task<bool> HasTimeOverlapAsync( int entityId, DateTime startDate, TimeSpan startTime, DateTime endDate, TimeSpan endTime, int? excludeJobId, string companyDatabase); /// Calculates total hours an entity is scheduled for on a specific date Task<decimal> CalculateDailyHoursAsync( int entityId, DateTime date, string companyDatabase, int? excludeScheduleId = null, ConflictSourceType? excludeSourceType = null); }"
  - paragraph [ref=e64]: "Key design decisions in this interface:"
  - list [ref=e65]:
    - listitem [ref=e66]:
      - code [ref=e67]: EntityType
      - text: property — each strategy self-declares which entity it handles. The router uses this to find the right strategy.
    - listitem [ref=e68]:
      - code [ref=e69]: companyDatabase
      - text: parameter on every method — supports GivingCare's multi-tenant architecture
    - listitem [ref=e70]:
      - code [ref=e71]: excludeScheduleId
      - text: +
      - code [ref=e72]: ConflictSourceType
      - text: — prevents false positives when editing an existing schedule (don't detect conflicts against yourself)
    - listitem [ref=e73]: 5 methods covering different levels of detail — from a simple "would this conflict?" boolean to a fully detailed analysis
  - heading "4. Two Implementations — Same Interface, Different Algorithms" [level=2] [ref=e74]
  - heading "EmployeeScheduleConflictStrategy" [level=3] [ref=e75]
  - paragraph [ref=e76]: "The employee strategy is the more complex one. It must query two separate schedule tables and check feature flags to know which modules are active:"
  - code [ref=e78]: "public class EmployeeScheduleConflictStrategy : IScheduleConflictStrategy { private readonly IDbContextFactoryService _contextFactory; private readonly ICompanyFeatureFlagService _featureFlagService; private readonly ILogger<EmployeeScheduleConflictStrategy> _logger; public string EntityType => ConflictEntityTypes.Employee; // \"Employee\" public async Task<List<ScheduleConflict>> GetScheduleConflictsAsync( int entityId, DateTime date, string companyDatabase) { await using var context = _contextFactory.CreateCompanyContext(companyDatabase); var conflicts = new List<ScheduleConflict>(); // Check which modules are enabled for this company var jobsEnabled = await _featureFlagService .IsFeatureEnabledAsync(companyDatabase, FeatureKeys.JobsModule); var schedulingEnabled = await _featureFlagService .IsFeatureEnabledAsync(companyDatabase, FeatureKeys.SchedulingModule); var allEntries = new List<...>(); // Source 1: JobSchedule table (if Jobs module is enabled) if (jobsEnabled) { var jobSchedules = await context.Set<JobSchedule>() .Include(s => s.Job) .Where(s => s.EmployeeId == entityId && s.ScheduleDate.Date == date.Date) .ToListAsync(); // Add to allEntries... } // Source 2: EmployeeDaySchedule table (if Scheduling module is enabled) if (schedulingEnabled) { var daySchedules = await context.Set<EmployeeDaySchedule>() .Include(eds => eds.EmployeeSchedule) .ThenInclude(es => es.Schedule) .Where(eds => eds.EmployeeId == entityId && eds.ScheduleDate.Date == date.Date) .ToListAsync(); // Add to allEntries... } // Detect conflicts across both sources if (allEntries.Count > 1) { /* build conflict list */ } return conflicts; } // Also checks approved LeaveRequests (blocking conflicts) // Also calculates cross-midnight shift overlaps // ... 450+ lines of employee-specific logic }"
  - paragraph [ref=e79]: "Key things about the employee strategy:"
  - list [ref=e80]:
    - listitem [ref=e81]:
      - text: Queries
      - strong [ref=e82]: two tables
      - text: ":"
      - code [ref=e83]: JobSchedule
      - text: and
      - code [ref=e84]: EmployeeDaySchedule
    - listitem [ref=e85]:
      - text: Gated by
      - strong [ref=e86]: feature flags
      - text: — only queries tables for enabled modules
    - listitem [ref=e87]:
      - text: Checks
      - strong [ref=e88]: approved leaves
      - text: — employees can have leave conflicts, equipment cannot
    - listitem [ref=e89]:
      - text: Needs
      - code [ref=e90]: ICompanyFeatureFlagService
      - text: as a dependency
  - heading "EquipmentScheduleConflictStrategy" [level=3] [ref=e91]
  - paragraph [ref=e92]: "The equipment strategy is simpler. It only queries one table and has no feature flags or leave checks:"
  - code [ref=e94]: "public class EquipmentScheduleConflictStrategy : IScheduleConflictStrategy { private readonly IDbContextFactoryService _contextFactory; private readonly ILogger<EquipmentScheduleConflictStrategy> _logger; public string EntityType => ConflictEntityTypes.Equipment; // \"Equipment\" public async Task<List<ScheduleConflict>> GetScheduleConflictsAsync( int entityId, DateTime date, string companyDatabase) { await using var context = _contextFactory.CreateCompanyContext(companyDatabase); // Only one source: JobEquipmentSchedule var equipmentSchedules = await context.Set<JobEquipmentSchedule>() .Include(s => s.Job) .Where(s => s.EquipmentId == entityId && s.ScheduleDate.Date == date.Date) .ToListAsync(); var conflicts = new List<ScheduleConflict>(); if (equipmentSchedules.Count > 1) { foreach (var schedule in equipmentSchedules) { conflicts.Add(new ScheduleConflict { ScheduleId = schedule.Id, JobId = schedule.JobId, JobCode = schedule.Job?.Code ?? string.Empty, JobName = schedule.Job?.Name ?? string.Empty, ScheduleDate = schedule.ScheduleDate, CheckInTime = schedule.CheckInTime, CheckOutTime = schedule.CheckOutTime, ConflictType = \"DoubleBooking\" }); } } return conflicts; } // No feature flags needed // No leave checking (equipment doesn't take holidays) // ... ~300 lines of equipment-specific logic }"
  - paragraph [ref=e95]:
    - text: Notice how each strategy has
    - strong [ref=e96]: different dependencies
    - text: . The employee strategy needs
    - code [ref=e97]: ICompanyFeatureFlagService
    - text: ; the equipment strategy doesn't. This is a major benefit — each algorithm class only injects what it actually needs.
  - heading "5. The Router — ScheduleConflictDetector" [level=2] [ref=e98]
  - paragraph [ref=e99]:
    - text: The
    - code [ref=e100]: ScheduleConflictDetector
    - text: is the facade that callers interact with. It receives ALL registered strategies via DI and routes to the correct one based on
    - code [ref=e101]: entityType
    - text: . This is the actual production code from
    - code [ref=e102]: Services/Core/Scheduling/ConflictDetection/ScheduleConflictDetector.cs
    - text: ":"
  - code [ref=e104]:
    - text: "public class ScheduleConflictDetector : IScheduleConflictDetector { private readonly IEnumerable<IScheduleConflictStrategy> _strategies; private readonly ILogger<ScheduleConflictDetector> _logger; public ScheduleConflictDetector( IEnumerable<IScheduleConflictStrategy> strategies, ILogger<ScheduleConflictDetector> logger) { _strategies = strategies; _logger = logger; } public async Task<List<ScheduleConflict>> GetScheduleConflictsAsync( string entityType, int entityId, DateTime date, string companyDatabase) { var strategy = GetStrategy(entityType); return await strategy.GetScheduleConflictsAsync(entityId, date, companyDatabase); } public async Task<DetailedConflictInfo> GetDetailedConflictsAsync( string entityType, int entityId, DateTime scheduleDate, DateTime endDate, TimeSpan startTime, TimeSpan endTime, int? excludeScheduleId, string companyDatabase, ConflictSourceType? excludeSourceType = null) { var strategy = GetStrategy(entityType); return await strategy.GetDetailedConflictsAsync( entityId, scheduleDate, endDate, startTime, endTime, excludeScheduleId, companyDatabase, excludeSourceType); } public async Task<bool> WouldCreateConflictAsync( string entityType, int entityId, DateTime date, int? excludeJobId, string companyDatabase) { var strategy = GetStrategy(entityType); return await strategy.WouldCreateConflictAsync( entityId, date, excludeJobId, companyDatabase); } public async Task<bool> HasTimeOverlapAsync( string entityType, int entityId, DateTime startDate, TimeSpan startTime, DateTime endDate, TimeSpan endTime, int? excludeJobId, string companyDatabase) { var strategy = GetStrategy(entityType); return await strategy.HasTimeOverlapAsync( entityId, startDate, startTime, endDate, endTime, excludeJobId, companyDatabase); } public async Task<decimal> CalculateDailyHoursAsync( string entityType, int entityId, DateTime date, string companyDatabase, int? excludeScheduleId = null, ConflictSourceType? excludeSourceType = null) { var strategy = GetStrategy(entityType); return await strategy.CalculateDailyHoursAsync( entityId, date, companyDatabase, excludeScheduleId, excludeSourceType); } /// Gets the appropriate strategy for the entity type. /// Throws if no strategy is registered for the type. private IScheduleConflictStrategy GetStrategy(string entityType) { var strategy = _strategies.FirstOrDefault(s => s.EntityType.Equals(entityType, StringComparison.OrdinalIgnoreCase)); if (strategy == null) { _logger.LogError( \"No conflict detection strategy registered for entity type: {EntityType}\", entityType); throw new ArgumentException("
    - generic [ref=e105]: "$\"No conflict detection strategy registered for entity type: {entityType}\""
    - text: "); } return strategy; } }"
  - generic [ref=e106]:
    - text: Read It Like English
    - code [ref=e107]: GetStrategy(entityType)
    - text: "reads as: \"Find the strategy that handles this entity type and give it to me. If none exists, throw an error.\""
  - paragraph [ref=e108]: "Notice the pattern in every public method — it's always the same two lines:"
  - list [ref=e109]:
    - listitem [ref=e110]:
      - code [ref=e111]: var strategy = GetStrategy(entityType);
      - text: — pick the right algorithm
    - listitem [ref=e112]:
      - code [ref=e113]: return await strategy.SomeMethodAsync(...);
      - text: — delegate to it
  - paragraph [ref=e114]:
    - text: The detector itself contains
    - strong [ref=e115]: zero business logic
    - text: . It is purely a routing mechanism. All the real work happens inside the strategies.
  - heading "6. DI Registration — The Magic Glue" [level=2] [ref=e116]
  - paragraph [ref=e117]:
    - text: In
    - code [ref=e118]: Extensions/ServiceCollectionExtensions.cs
    - text: ", the strategies are registered like this:"
  - code [ref=e120]: // Register each strategy as an implementation of the interface builder.Services.AddScoped<IScheduleConflictStrategy, EmployeeScheduleConflictStrategy>(); builder.Services.AddScoped<IScheduleConflictStrategy, EquipmentScheduleConflictStrategy>(); // Register the detector (router) builder.Services.AddScoped<IScheduleConflictDetector, ScheduleConflictDetector>();
  - heading "How Does This Work?" [level=3] [ref=e121]
  - paragraph [ref=e122]:
    - text: When you register
    - strong [ref=e123]: multiple implementations
    - text: of the same interface, .NET DI collects them all. If a constructor asks for
    - code [ref=e124]: IEnumerable<IScheduleConflictStrategy>
    - text: ", it receives a collection containing every registered implementation."
  - generic [ref=e125]: "DI Container: IScheduleConflictStrategy #1 --> EmployeeScheduleConflictStrategy IScheduleConflictStrategy #2 --> EquipmentScheduleConflictStrategy ScheduleConflictDetector constructor asks for: IEnumerable<IScheduleConflictStrategy> DI delivers: [ EmployeeScheduleConflictStrategy, EquipmentScheduleConflictStrategy ] GetStrategy(\"Employee\") --> scans the list --> returns #1 GetStrategy(\"Equipment\") --> scans the list --> returns #2 GetStrategy(\"Vehicle\") --> scans the list --> null --> THROWS"
  - paragraph [ref=e126]:
    - text: "This is the key insight:"
    - strong [ref=e127]: DI becomes the strategy registry
    - text: . You don't need to maintain a manual dictionary or factory method. Just register new strategies, and the detector discovers them automatically.
  - heading "7. Other Strategy Patterns in GivingCare" [level=2] [ref=e128]
  - paragraph [ref=e129]: "The conflict detector isn't the only place GivingCare uses the Strategy Pattern. The attendance export system uses it twice:"
