  - heading "9. Adding a New Strategy — Step by Step" [level=2] [ref=e232]
  - paragraph [ref=e233]: "Let's say you need to add vehicle scheduling conflict detection. Here's exactly what you do:"
  - 'heading "Step 1: Create the Strategy Class" [level=3] [ref=e234]'
  - code [ref=e236]: "namespace GivingCare.Services.Core.Scheduling.ConflictDetection.Strategies; public class VehicleScheduleConflictStrategy : IScheduleConflictStrategy { private readonly IDbContextFactoryService _contextFactory; private readonly ILogger<VehicleScheduleConflictStrategy> _logger; public string EntityType => \"Vehicle\"; // Step 2: Self-declare the entity type public VehicleScheduleConflictStrategy( IDbContextFactoryService contextFactory, ILogger<VehicleScheduleConflictStrategy> logger) { _contextFactory = contextFactory; _logger = logger; } // Step 3: Implement all 5 interface methods with vehicle-specific logic public async Task<List<ScheduleConflict>> GetScheduleConflictsAsync( int entityId, DateTime date, string companyDatabase) { await using var context = _contextFactory.CreateCompanyContext(companyDatabase); // Query VehicleSchedule table (vehicle-specific logic) var vehicleSchedules = await context.Set<VehicleSchedule>() .Include(s => s.Job) .Where(s => s.VehicleId == entityId && s.ScheduleDate.Date == date.Date) .ToListAsync(); // Vehicle-specific: check fuel range, maintenance windows, driver assignments... return conflicts; } // ... implement remaining 4 methods ... }"
  - 'heading "Step 4: Register in DI" [level=3] [ref=e237]'
  - code [ref=e239]: "// In Extensions/ServiceCollectionExtensions.cs — add ONE line: builder.Services.AddScoped<IScheduleConflictStrategy, VehicleScheduleConflictStrategy>();"
  - 'heading "Step 5: Done" [level=3] [ref=e240]'
  - paragraph [ref=e241]:
    - text: That's it. The
    - code [ref=e242]: ScheduleConflictDetector
    - text: automatically discovers the new strategy because DI adds it to the
    - code [ref=e243]: IEnumerable<IScheduleConflictStrategy>
    - text: collection. No changes needed to the detector, no changes to existing strategies, no changes to any other file.
  - generic [ref=e244]:
    - strong [ref=e245]: "Before (2 strategies):"
    - text: "DI: [ EmployeeStrategy, EquipmentStrategy ] GetStrategy(\"Vehicle\") --> null --> THROWS"
    - strong [ref=e246]: "After (3 strategies, ONE line of DI registration):"
    - text: "DI: [ EmployeeStrategy, EquipmentStrategy, VehicleStrategy ] GetStrategy(\"Vehicle\") --> VehicleStrategy --> works!"
  - paragraph [ref=e247]:
    - text: "This is the Open/Closed Principle in action: the system is"
    - strong [ref=e248]: open for extension
    - text: (add new strategies) but
    - strong [ref=e249]: closed for modification
    - text: (existing code doesn't change).
