  - code [ref=e134]: "public interface IExportGenerator { ExportFormat Format { get; } // The key: Excel, Csv, or Pdf string ContentType { get; } // MIME type for HTTP response string FileExtension { get; } // .xlsx, .csv, or .pdf byte[] Generate(ReportData data, ExportOptions options); }"
  - code [ref=e136]: "public class PdfExportGenerator : IExportGenerator { public ExportFormat Format => ExportFormat.Pdf; public string ContentType => \"application/pdf\"; public string FileExtension => \".pdf\"; // Uses QuestPDF library for PDF generation } public class ExcelExportGenerator : IExportGenerator { public ExportFormat Format => ExportFormat.Excel; public string ContentType => \"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet\"; public string FileExtension => \".xlsx\"; // Uses ClosedXML library for Excel generation } public class CsvExportGenerator : IExportGenerator { public ExportFormat Format => ExportFormat.Csv; public string ContentType => \"text/csv\"; public string FileExtension => \".csv\"; // Uses StringBuilder + pt-PT culture for CSV }"
