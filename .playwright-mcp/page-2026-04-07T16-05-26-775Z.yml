  - paragraph [ref=e178]:
    - text: The
    - code [ref=e179]: AttendanceExportService
    - text: "combines both strategies in a single pipeline. It selects one builder (by report type) and one generator (by format):"
  - code [ref=e181]: "public class AttendanceExportService : IAttendanceExportService { private readonly IEnumerable<IReportBuilder> _builders; private readonly IEnumerable<IExportGenerator> _generators; public async Task<ExportResult> GenerateReportAsync( ExportRequest request, string companyDatabase) { // Strategy #1: Pick the right report builder var builder = _builders.FirstOrDefault(b => b.ReportType == request.ReportType); if (builder == null) return ExportResult.Failure($\"Tipo de relatorio nao suportado: {request.ReportType}\"); // Strategy #2: Pick the right format generator var generator = _generators.FirstOrDefault(g => g.Format == request.Format); if (generator == null) return ExportResult.Failure($\"Formato nao suportado: {request.Format}\"); // Build the data (strategy #1) var reportData = await builder.BuildAsync(context); // Generate the file (strategy #2) var bytes = generator.Generate(reportData, request.Options); return ExportResult.Ok(fileName, bytes, generator.ContentType); } }"
