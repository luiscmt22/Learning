    - generic [ref=e16]: The Strategy Pattern swaps an if/else algorithm chain for a set of interchangeable classes that all implement the same interface, selected at runtime by a key.
    - generic [ref=e17]: Every time you catch yourself writing 'if entityType == Employee do this, else if Equipment do that', a 300-line method is trying to be born. This tutorial shows you how to strangle it in the crib.
    - generic [ref=e18]:
      - generic [ref=e19]: Executive summary
      - generic [ref=e20]: "This tutorial teaches the Strategy Pattern by showing a concrete refactor: a 300-line DetectConflicts method with nested if/else on entityType becomes a small IScheduleConflictStrategy interface and two classes (EmployeeScheduleConflictStrategy, EquipmentScheduleConflictStrategy) that the ScheduleConflictDetector routes between using IEnumerable<IStrategy> injected by DI. It then generalises the pattern with additional real examples (IExportGenerator, IReportBuilder) and contrasts it with Chain of Responsibility, which runs all handlers in sequence rather than selecting one."
