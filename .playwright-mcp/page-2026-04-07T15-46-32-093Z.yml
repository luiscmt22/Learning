        - generic [ref=e246]:
          - code [ref=e248]: "public interface IStockService { // Point-in-time stock query Task<ArtigoStock?> GetArticleStockByDateAsync(int artigoId, DateTime date); // Movement history retrieval Task<List<StockMov>> GetStockMovementsAsync( int artigoId, DateTime? startDate = null, DateTime? endDate = null); // Aggregated totals calculation Task<(decimal entradas, decimal saidas)> GetStockTotalsAsync( int artigoId, DateTime? startDate = null, DateTime? endDate = null); // Document line flow check Task<decimal> CheckFluxoAsync(int artigoId, DateTime date, int linhaId); }"
          - button "Copy" [ref=e249] [cursor=pointer]
        - heading "# StockService Implementation" [level=3] [ref=e250]
        - heading "GetArticleStockByDateAsync" [level=4] [ref=e251]
        - generic [ref=e252]:
          - code [ref=e254]: "public async Task<ArtigoStock?> GetArticleStockByDateAsync(int artigoId, DateTime date) { // Critical: Add one day for end-of-day inclusion var dateWithTime = date.Date.AddDays(1); await using var dbContext = await _contextFactory.CreateDbContextAsync(); await using var connection = dbContext.Database.GetDbConnection(); await connection.OpenAsync(); // Direct SQL function call for performance await using var command = connection.CreateCommand(); command.CommandText = \"SELECT * FROM dbo.fn_ArtigoStockByDate(@ArtigoId, @Date)\"; command.CommandType = CommandType.Text; // Strongly-typed parameters prevent SQL injection command.Parameters.Add(new SqlParameter(\"@ArtigoId\", SqlDbType.Int) { Value = artigoId }); command.Parameters.Add(new SqlParameter(\"@Date\", SqlDbType.DateTime) { Value = dateWithTime }); await using var reader = await command.ExecuteReaderAsync(); if (await reader.ReadAsync()) { return new ArtigoStock { ArtigoId = reader.GetInt32(reader.GetOrdinal(\"ARTIGO_ID\")), Entrada = reader.GetDecimal(reader.GetOrdinal(\"ENTRADA\")), Saida = reader.GetDecimal(reader.GetOrdinal(\"SAIDA\")), Stock = reader.GetDecimal(reader.GetOrdinal(\"STOCK\")) }; } return null; }"
          - button "Copy" [ref=e255] [cursor=pointer]
        - heading "GetStockMovementsAsync" [level=4] [ref=e256]
        - generic [ref=e257]:
          - code [ref=e259]: "public async Task<List<StockMov>> GetStockMovementsAsync( int artigoId, DateTime? startDate = null, DateTime? endDate = null) { using var dbContext = await _contextFactory.CreateDbContextAsync(); // Complex LINQ join for movement tracking var query = dbContext.CrmDocumentoDetalhes .Join(dbContext.CrmDocumentos, detalhe => detalhe.Documentoid, doc => doc.Id, (detalhe, doc) => new { detalhe, doc }) .Join(dbContext.CrmTipoDocumentos, x => x.doc.Tipodocumentoid, tipo => tipo.Id, (x, tipo) => new { x.detalhe, x.doc, tipo }) .Join(dbContext.CrmSerieDocumentos, x => x.doc.Serieid, serie => serie.Id, (x, serie) => new { x.detalhe, x.doc, x.tipo, serie }) .Where(x => x.detalhe.ArtigoId == artigoId && x.tipo.Movstocks == true); // Dynamic date filtering if (startDate.HasValue) query = query.Where(x => x.doc.Data >= startDate.Value.Date); if (endDate.HasValue) query = query.Where(x => x.doc.Data <= endDate.Value.Date.AddDays(1).AddSeconds(-1)); return await query .Select(x => new StockMov { ArtigoId = x.detalhe.ArtigoId, doc = x.doc, docdetalhe = x.detalhe, doctipo = x.tipo, docserie = x.serie }) .OrderByDescending(s => s.doc.Data) .ToListAsync(); }"
