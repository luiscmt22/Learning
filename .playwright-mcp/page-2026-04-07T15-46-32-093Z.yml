      - generic [ref=e160]:
        - paragraph [ref=e161]: Every time a user clicks the Stock tab on an article page, the database has to sum every inbound and outbound movement since the beginning of time to tell them how many units are on the shelf. That's expensive. Now imagine 40 users clicking that tab every minute across 50,000 articles. This is how you make that scream instead of crawl.
        - generic [ref=e162]:
          - heading "Executive summary" [level=3] [ref=e163]
          - paragraph [ref=e164]: "This is the formal architecture document for the Stock Service — a three-layer system (UI/Service/Data) where a CachedStockService decorator wraps a StockService implementation that talks to SQL Server table-valued functions (fn_ArtigoStockByDate, fn_ArtigoUsedInFluxo) through a raw ADO.NET connection for performance. The caching strategy uses graduated expiration: 1 hour for historical data older than 7 days, 5 minutes for recent data, nothing at all for filtered queries. Razor components pre-load expensive operations as Tasks in OnInitializedAsync so that by the time the user clicks the Stock tab, the data is already there. The doc also covers extension methods, health checks, structured logging with cache-hit tagging, cache inspection endpoints, and future enhancements like Redis and SignalR-driven invalidation."
        - generic [ref=e165]:
          - generic [ref=e166]: 💡
          - generic [ref=e167]:
            - generic [ref=e168]: Metaphor
            - text: The Stock Service is a coffee shop with a secret second menu — the barista keeps sticky notes of the most recent orders so that if you ask for the same drink someone just ordered, they hand it to you instantly. Regular espresso from yesterday? Sticky note lasts an hour because yesterday can't change. Today's cappuccino? Sticky note lasts five minutes because someone might modify it. A custom half-caf oat milk with exactly 1.5 pumps of vanilla? No sticky note — too specific, nobody else is ordering that.
        - generic [ref=e169]:
          - generic [ref=e170]:
            - heading "1 Why it exists" [level=3] [ref=e171]:
              - generic [ref=e172]: "1"
              - text: Why it exists
            - paragraph [ref=e173]: Inventory queries are the most asked question in a warehouse ERP, and they're brutally expensive because computing 'what did I have on January 15th?' means summing every movement from the beginning of time up to that date. Hitting the database for every query brings the system to its knees and users wait 2-3 seconds every single time. The Stock Service exists to eliminate that wait by caching aggressively for data that doesn't change (historical stock) and conservatively for data that might (today's stock), while never caching filtered queries that are too specific to repeat. The result is sub-millisecond responses for 99% of queries with the database staying cool.
          - generic [ref=e174]:
            - heading "2 What it does" [level=3] [ref=e175]:
              - generic [ref=e176]: "2"
              - text: What it does
            - paragraph [ref=e177]: "Exposes an IStockService with four operations: GetArticleStockByDateAsync (point-in-time query), GetStockMovementsAsync (movement history with optional date filters), GetStockTotalsAsync (aggregate entradas/saídas), and CheckFluxoAsync (per-document-line flow). A CachedStockService wraps the real StockService as a decorator and checks IMemoryCache first, falling back to the real service on miss and then storing the result with an expiration chosen based on how old the queried date is. The UI layer (ArtigoDetalhe.razor) kicks off stock queries as Tasks in OnInitializedAsync so that clicking the Stock tab awaits an already-completed task."
          - generic [ref=e178]:
            - heading "3 How it works" [level=3] [ref=e179]:
              - generic [ref=e180]: "3"
              - text: How it works
            - paragraph [ref=e181]: "Under the hood, the StockService opens a raw SqlCommand on the DbContext's connection and invokes the dbo.fn_ArtigoStockByDate table-valued function with parameterized arguments — deliberately bypassing EF Core's change tracker and LINQ translation for maximum speed. A 'smart trick' adds one day to the filter date so the query includes everything up to end-of-day. Movement queries use EF Core LINQ with three joins (CrmDocumentoDetalhes → CrmDocumentos → CrmTipoDocumentos → CrmSerieDocumentos) filtered by Movstocks=true. The CachedStockService generates keys like 'stock_{artigoId}_{yyyyMMdd}' and picks an expiration: TimeSpan.FromHours(1) if the date is more than 7 days old, TimeSpan.FromMinutes(5) otherwise. The Razor layer orchestrates task reuse — if a filter hasn't changed, it awaits the existing _stockMovementsTask field; if the filter did change, it creates a new task and parallel-awaits a totals task alongside it. Health checks run a test query + cache statistics, and structured logging emits one-line entries with ArticleId, Date, CacheHit, and ExecutionTime tags for monitoring."
