        - heading "✓ Key takeaways" [level=3] [ref=e503]
        - list [ref=e504]:
          - listitem [ref=e505]: Wrap expensive services with a cached decorator so caching logic lives in one place and tests can swap it out
          - listitem [ref=e506]: Cache expiration should be proportional to how likely the data is to change — historical = long, recent = short, filtered = don't bother
          - listitem [ref=e507]: SQL Server table-valued functions called via raw ADO.NET skip EF Core overhead and are perfect for pure-aggregate queries
          - listitem [ref=e508]: Start expensive Tasks in OnInitializedAsync and store them as fields — clicking a tab then awaits an already-complete task
          - listitem [ref=e509]: Cache keys should encode everything that distinguishes the query (artigoId + date) and the format should be predictable for manual invalidation
          - listitem [ref=e510]: Monitor cache hit rates via IMemoryCache.GetCurrentStatistics in a health check — if the ratio degrades, something upstream changed
