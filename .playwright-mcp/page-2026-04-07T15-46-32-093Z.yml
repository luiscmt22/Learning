        - heading "Graduated Expiration Strategy" [level=4] [ref=e268]
        - generic [ref=e269]:
          - code [ref=e271]: "public async Task<ArtigoStock?> GetArticleStockByDateAsync(int artigoId, DateTime date) { var cacheKey = $\"stock_{artigoId}_{date:yyyyMMdd}\"; // L1 Cache: Memory Check if (_cache.TryGetValue<ArtigoStock>(cacheKey, out var cachedStock)) { _logger.LogDebug(\"Stock cache hit for article {ArtigoId} at date {Date}\", artigoId, date); return cachedStock; } // L2: Database Query var stock = await _innerService.GetArticleStockByDateAsync(artigoId, date); if (stock != null) { // Intelligent expiration based on data age var cacheExpiration = date.Date < DateTime.Today.AddDays(-7) ? TimeSpan.FromHours(1) // Historical: 1 hour : TimeSpan.FromMinutes(5); // Recent: 5 minutes _cache.Set(cacheKey, stock, cacheExpiration); } return stock; }"
