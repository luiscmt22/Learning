      - generic [ref=e57]:
        - paragraph [ref=e58]: Why does putting LINQ in a Razor component feel good in the moment and terrible six months later? Because the component becomes a 300-line frankenclass that can't be tested, can't be reused, and breaks every time a business rule changes. Clean Architecture is the discipline that makes the short-term pain of writing a service method pay off every single time you edit the feature later.
        - generic [ref=e59]:
          - heading "Executive summary" [level=3] [ref=e60]
          - paragraph [ref=e61]: "This is a short introduction to Clean Architecture tuned for a Blazor Server codebase (HRModule). It explains the three-layer model — UI displays and calls services, services hold all business logic, data is only touched by services — and contrasts 'good' and 'bad' Blazor components side-by-side. The second half introduces the ServiceResult<T> wrapper as a unified return type (Success bool, Message string, Data T) so UI code can branch on result.Success without needing try/catch or sentinel return values. The payoff is testability: a service with no UI dependencies can be unit-tested with a mock DbContext. The doc closes with a mistakes table (LINQ in Razor, DbContext in component, validation in UI, bloated @code blocks)."
        - generic [ref=e62]:
          - generic [ref=e63]: 💡
          - generic [ref=e64]:
            - generic [ref=e65]: Metaphor
            - text: Clean Architecture is like a restaurant. The UI is the waiter — takes the order, delivers the food, smiles at the customer, never cooks. The service layer is the chef — knows every recipe, handles the heat, decides substitutions, returns the plate or a 'we're out of salmon' apology. The data layer is the pantry and fridge — only the chef goes in. Put a customer in the kitchen (LINQ in Razor) and you get chaos. Make the waiter cook (validation in UI) and you get burnt toast and a legal liability.
