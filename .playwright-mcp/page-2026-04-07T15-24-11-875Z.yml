        - heading "Understanding Clean Architecture" [level=1] [ref=e90]
        - heading "# What is Clean Architecture?" [level=2] [ref=e91]
        - paragraph [ref=e92]:
          - text: Clean Architecture separates your application into layers, where each layer has a specific responsibility. The key principle is that
          - strong [ref=e93]: dependencies point inward
          - text: "- outer layers depend on inner layers, never the reverse."
        - heading "# HRModule Architecture Layers" [level=2] [ref=e94]
        - generic [ref=e96]: ┌─────────────────────────────────────────────────────────┐ │ UI LAYER │ │ (Razor Pages, Components) │ │ - Displays data │ │ - Handles user input │ │ - Calls services │ │ - NO business logic │ └────────────────────────┬────────────────────────────────┘ │ depends on ▼ ┌─────────────────────────────────────────────────────────┐ │ SERVICE LAYER │ │ (IEmployeeService, IAuthorizationService, etc.) │ │ - ALL business logic │ │ - Validation │ │ - Orchestration │ │ - Returns ServiceResult<T> │ └────────────────────────┬────────────────────────────────┘ │ depends on ▼ ┌─────────────────────────────────────────────────────────┐ │ DATA LAYER │ │ (DbContext, Models) │ │ - Database access │ │ - Entity definitions │ │ - EF Core configurations │ └─────────────────────────────────────────────────────────┘
        - heading "# The Golden Rules" [level=2] [ref=e97]
        - 'heading "# 1. UI Layer: Display Only" [level=3] [ref=e98]'
        - generic [ref=e99]:
          - code [ref=e101]: "<!-- GOOD: UI just displays and calls service --> @inject IEmployeeService EmployeeService <MudText>@employee.Nome</MudText> <MudButton OnClick=\"SaveEmployee\">Guardar</MudButton> @code { private async Task SaveEmployee() { var result = await EmployeeService.UpdateEmployeeAsync(employee); if (!result.Success) Snackbar.Add(result.Message, Severity.Error); } }"
          - button "Copy" [ref=e102] [cursor=pointer]
        - generic [ref=e103]:
          - code [ref=e105]: "<!-- BAD: Business logic in UI --> @code { private async Task SaveEmployee() { // DON'T DO THIS - validation belongs in service if (string.IsNullOrEmpty(employee.Nome)) { Snackbar.Add(\"Nome obrigatorio\", Severity.Error); return; } // DON'T DO THIS - DB access belongs in service await _context.Funcionarios.AddAsync(employee); await _context.SaveChangesAsync(); } }"
          - button "Copy" [ref=e106] [cursor=pointer]
        - 'heading "# 2. Service Layer: All Business Logic" [level=3] [ref=e107]'
        - generic [ref=e108]:
          - code [ref=e110]: "// GOOD: Business logic in service public class EmployeeService : IEmployeeService { public async Task<ServiceResult<CrmFuncionario>> UpdateEmployeeAsync( EmpresaUserSession session, CrmFuncionario employee) { // Validation if (string.IsNullOrEmpty(employee.Nome)) return ServiceResult<CrmFuncionario>.Failure(\"Nome obrigatorio\"); // Business rules if (employee.DataNascimento > DateTime.Today) return ServiceResult<CrmFuncionario>.Failure(\"Data invalida\"); // Database operation await using var context = await _contextFactory.CreateDbContextAsync(session.CompanyDatabase); context.Funcionarios.Update(employee); await context.SaveChangesAsync(); // Audit await _auditService.LogAsync(session.User.Id, $\"Updated employee {employee.Id}\"); return ServiceResult<CrmFuncionario>.Success(employee); } }"
