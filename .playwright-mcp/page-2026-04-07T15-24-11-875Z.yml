        - heading "# 3. ServiceResult Pattern" [level=3] [ref=e112]
        - paragraph [ref=e113]: "Always return results with success/failure status:"
        - generic [ref=e114]:
          - code [ref=e116]: "public class ServiceResult<T> { public bool Success { get; set; } public string Message { get; set; } public T? Data { get; set; } public static ServiceResult<T> Success(T data) => new() { Success = true, Data = data }; public static ServiceResult<T> Failure(string message) => new() { Success = false, Message = message }; }"
