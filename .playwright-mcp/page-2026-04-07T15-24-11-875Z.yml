        - heading "✓ Key takeaways" [level=3] [ref=e164]
        - list [ref=e165]:
          - listitem [ref=e166]: UI components should never touch DbContext, validate business rules, or use LINQ directly — delegate to a service
          - listitem [ref=e167]: Business logic lives in services and ONLY in services — if you're validating in two places, you're about to drift
          - listitem [ref=e168]: ServiceResult<T> is a unified return contract that lets UI code branch on Success without try/catch or null checks
          - listitem [ref=e169]: "The testability win is real: a service with no UI dependencies can be unit-tested with a mocked DbContext and no browser"
          - listitem [ref=e170]: The same service can power Blazor UI, API endpoints, and background jobs — because it has no UI-specific code inside it
