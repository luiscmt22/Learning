<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IdentityRoadmap</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root {
  --bg: #0b1220;
  --surface: #111a2e;
  --surface-2: #16223c;
  --border: #243352;
  --text: #e6ecf5;
  --text-dim: #9aa7c0;
  --accent: #6aa6ff;
  --accent-2: #b06aff;
  --code-bg: #0a1120;
  --ok: #4ade80;
  --warn: #fbbf24;
  --bad: #f87171;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0;
  background: var(--bg); color: var(--text);
  font: 16px/1.65 -apple-system, "Segoe UI", system-ui, sans-serif;
}
.wrap { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
header.doc-head {
  border-bottom: 1px solid var(--border);
  padding-bottom: 16px; margin-bottom: 28px;
}
header.doc-head .crumbs { color: var(--text-dim); font-size: 13px; }
header.doc-head h1 { margin: 6px 0 4px; font-size: 28px; line-height: 1.2; }
header.doc-head .meta { color: var(--text-dim); font-size: 13px; }
header.doc-head .meta a { color: var(--accent); text-decoration: none; }
header.doc-head .meta a:hover { text-decoration: underline; }
h1, h2, h3, h4 { color: var(--text); margin-top: 1.6em; }
h2 { border-bottom: 1px solid var(--border); padding-bottom: 6px; }
a { color: var(--accent); }
code, pre, code.il { font-family: "JetBrains Mono", "Cascadia Code", Consolas, monospace; }
code.il { background: var(--code-bg); padding: 1px 6px; border-radius: 4px; font-size: 0.92em; border: 1px solid var(--border); }
pre {
  background: var(--code-bg); border: 1px solid var(--border); border-radius: 8px;
  padding: 14px 16px; overflow-x: auto; font-size: 13px; line-height: 1.55;
}
pre code { background: transparent; border: 0; padding: 0; }
blockquote {
  border-left: 3px solid var(--accent);
  background: var(--surface);
  padding: 10px 16px; margin: 12px 0;
  color: var(--text-dim);
  border-radius: 0 6px 6px 0;
}
.diagram-box {
  background: #1e293b; border: 1px solid var(--border);
  border-radius: 8px; padding: 14px; overflow-x: auto;
}
.diagram-box pre { background: transparent; border: 0; padding: 0; color: #e6ecf5; }
.tbl-wrap { overflow-x: auto; margin: 14px 0; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { border: 1px solid var(--border); padding: 8px 12px; text-align: left; vertical-align: top; }
th { background: var(--surface-2); }
tr:nth-child(even) td { background: var(--surface); }
.img-ref { color: var(--text-dim); font-style: italic; }
.empty-note { color: var(--text-dim); font-style: italic; padding: 12px; background: var(--surface); border-radius: 6px; border: 1px dashed var(--border); }
.pdf-page { margin: 22px 0; padding: 16px 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; }
.pdf-page h3 { margin: 0 0 8px; font-size: 14px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.5px; }
.pdf-page pre { background: var(--code-bg); }
.dup-banner {
  background: rgba(251, 191, 36, 0.10);
  border: 1px solid rgba(251, 191, 36, 0.40);
  color: var(--warn);
  padding: 10px 14px;
  border-radius: 6px;
  margin-bottom: 18px;
  font-size: 14px;
}
.dup-banner strong { color: var(--warn); }
.dup-banner a { color: var(--accent); }
</style>
</head>

</html>
