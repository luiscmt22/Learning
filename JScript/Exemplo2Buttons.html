<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo de Botões Padrão</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            /* Cores base */
            --primary: #000000;    /* Vermelho primário */
            --secondary: #f8f8f8;  /* Fundo secundário */
            --success: #2ecc71;    /* Verde */
            --info: #3498db;       /* Azul */
            --warning: #f39c12;    /* Laranja */
            --danger: #e74c3c;     /* Vermelho */
            --purple: #9b59b6;     /* Roxo */
            --dark: #333333;       /* Texto escuro */
            --light: #ffffff;      /* Branco */
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            line-height: 1.6;
            color: var(--dark);
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1, h2 {
            color: var(--primary);
        }

        .category {
            background-color: var(--light);
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 30px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .button-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 15px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 10px 15px;
            border-radius: 6px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            border: none;
            text-align: left;
            gap: 8px;
            position: relative;
        }

        /* Primary Buttons */
        .btn-primary {
            background-color: var(--primary);
            color: var(--light);
        }
        .btn-primary:hover {
            background-color: #5b5859;
            transform: translateY(-2px);
        }

        /* Secondary Buttons */
        .btn-secondary {
            background-color: var(--secondary);
            color: var(--dark);
            border: 1px solid #ddd;
        }
        .btn-secondary:hover {
            background-color: #e0e0e0;
        }

        /* Success Buttons */
        .btn-success {
            background-color: var(--success);
            color: var(--light);
			
        }
        .btn-success:hover {
            background-color: #27ae60;
        }

        /* Info Buttons */
        .btn-info {
            background-color: var(--info);
            color: var(--light);
        }
        .btn-info:hover {
            background-color: #2980b9;
        }

        /* Warning Buttons */
        .btn-warning {
            background-color: var(--warning);
            color: var(--light);
        }
        .btn-warning:hover {
            background-color: #d35400;
        }

        /* Danger Buttons */
        .btn-danger {
            background-color: var(--danger);
            color: var(--light);
        }
        .btn-danger:hover {
            background-color: #c0392b;
        }

        /* Purple Buttons */
        .btn-purple {
            background-color: var(--purple);
            color: var(--light);
        }
        .btn-purple:hover {
            background-color: #8e44ad;
        }

        /* Tertiary Buttons */
        .btn-tertiary {
            background-color: transparent;
            color: var(--dark);
            border: 1px solid #ddd;
        }
        .btn-tertiary:hover {
            background-color: #f5f5f5;
        }

        /* Ações de Arquivo (contorno + texto) */
        .btn-file {
            background-color: transparent;
            border: 2px solid;
            font-weight: 600;
        }
        .btn-file-download {
            border-color: var(--info);
            color: var(--info);
        }
        .btn-file-download:hover {
            background-color: var(--info);
            color: white;
        }
        .btn-file-export {
            border-color: var(--info);
            color: var(--info);
        }
        .btn-file-export:hover {
            background-color: var(--info);
            color: white;
        }
        .btn-file-import {
            border-color: var(--success);
            color: var(--success);
        }
        .btn-file-import:hover {
            background-color: var(--success);
            color: white;
        }

        /* Ações de Sistema (apenas ícone) */
        .btn-icon {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background-color: transparent;
            color: var(--dark);
            position: relative;
        }
        .btn-icon:hover {
            background-color: rgba(0,0,0,0.1);
            animation: pulse 0.5s ease;
        }
        .btn-icon::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: -35px;
            left: 50%;
            transform: translateX(-50%);
            background-color: var(--dark);
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.3s;
            white-space: nowrap;
            pointer-events: none;
        }
        .btn-icon:hover::after {
            opacity: 1;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .icon {
            width: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <h1>Catálogo de Botões Padrão</h1>

    <!-- Ações Primárias -->
    <div class="category">
        <h2>Ações Primárias</h2>
        <div class="button-grid">
            <button class="btn btn-primary">
                <i class="fas fa-plus icon"></i> Adicionar
            </button>
            <button class="btn btn-info">
                <i class="fas fa-save icon"></i> Guardar
            </button>
            <button class="btn btn-warning">
                <i class="fas fa-pen icon"></i> Editar
            </button>
            <button class="btn btn-danger">
                <i class="fas fa-trash icon"></i> Eliminar
            </button>
            <button class="btn btn-purple">
                <i class="fas fa-clone icon"></i> Clonar
            </button>
        </div>
    </div>

    <!-- Ações de Arquivo -->
    <div class="category">
        <h2>Ações de Arquivo</h2>
        <div class="button-grid">
            <button class="btn btn-file btn-file-download">
                <i class="fas fa-download icon"></i> Download
            </button>
            <button class="btn btn-file btn-file-export">
                <i class="fas fa-file-pdf icon"></i> Exportar PDF
            </button>
            <button class="btn btn-file btn-file-import">
                <i class="fas fa-file-import icon"></i> Importar
            </button>
        </div>
    </div>

    <!-- Ações de Navegação -->
    <div class="category">
        <h2>Ações de Navegação</h2>
        <div class="button-grid">
            <button class="btn btn-secondary">
                <i class="fas fa-arrow-left icon"></i> Voltar
            </button>
            <button class="btn btn-info">
                <i class="fas fa-sync-alt icon"></i> Atualizar
            </button>
            <button class="btn btn-success">
                <i class="fas fa-exchange-alt icon"></i> Sincronizar
            </button>
            <button class="btn btn-primary">
                <i class="fas fa-sign-in-alt icon"></i> Login
            </button>
        </div>
    </div>

    <!-- Ações Secundárias -->
    <div class="category">
        <h2>Ações Secundárias</h2>
        <div class="button-grid">
            <button class="btn btn-secondary">
                <i class="fas fa-folder-open icon"></i> Detalhes Lista
            </button>
            <button class="btn btn-danger">
                <i class="fas fa-ban icon"></i> Cancelar
            </button>
            <button class="btn btn-success">
                <i class="fas fa-check icon"></i> Concluir
            </button>
            <button class="btn btn-warning">
                <i class="fas fa-rotate-left icon"></i> Reabrir
            </button>
        </div>
    </div>

    <!-- Ações Terciárias -->
    <div class="category">
        <h2>Ações Terciárias</h2>
        <div class="button-grid">
            <button class="btn btn-tertiary">
                <i class="fas fa-list-check icon"></i> Listar (Check)
            </button>
            <button class="btn btn-tertiary">
                <i class="fas fa-list-ul icon"></i> Listar (UL)
            </button>
            <button class="btn btn-tertiary">
                <i class="fas fa-xmark icon"></i> Fechar
            </button>
            <button class="btn btn-tertiary">
                <i class="fas fa-arrow-up icon"></i> Expandir
            </button>
            <button class="btn btn-tertiary">
                <i class="fas fa-arrow-down icon"></i> Diminuir
            </button>
        </div>
    </div>

    <!-- Ações de Sistema (ALTERADO: apenas ícones com tooltip) -->
    <div class="category">
        <h2>Ações de Sistema</h2>
        <div class="button-grid">
            <button class="btn btn-icon" data-tooltip="Menu">
                <i class="fas fa-bars"></i>
            </button>
            <button class="btn btn-icon" data-tooltip="Configurações">
                <i class="fas fa-gear"></i>
            </button>
            <button class="btn btn-icon" data-tooltip="Mostrar">
                <i class="fas fa-eye"></i>
            </button>
            <button class="btn btn-icon" data-tooltip="Ocultar">
                <i class="fas fa-eye-slash"></i>
            </button>
            <button class="btn btn-icon" data-tooltip="Utilizador">
                <i class="fas fa-user"></i>
            </button>
        </div>
    </div>
</body>
</html>
